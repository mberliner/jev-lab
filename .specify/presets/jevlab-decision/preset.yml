schema_version: "1.0"

preset:
  id: "jevlab-decision"
  name: "jev-lab: decisiones Jev"
  version: "0.1.1"
  description: "Exige en la spec la tabla de decisiones (pregunta, primitiva, escape, riesgo) y en el plan su diseño (DecisionSpec, estado mínimo, umbrales) (Constitución I, II, III y IV)."

requires:
  speckit_version: ">=1.1.4.dev0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Sección «Decisiones Jev»"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Sección «Diseño de decisiones»"
      strategy: "append"

tags:
  - "jev-lab"
  - "decision"
