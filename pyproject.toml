[project]
name = "jevlab"
version = "0.1.0"
description = "Laboratorio progresivo de Jev (TypeSafe): decisiones tipadas, de lo básico a producción"
authors = [
    { name = "mberliner", email = "cancilleria_uno@hotmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai==3.29.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "typer==0.27.3",
    "typesafe-sdk==0.7.4",
]

[project.scripts]
jevlab = "jevlab.entrypoints.cli.main:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.169.0",
    "import-linter==2.15",
    "mypy==2.4.0",
    "poethepoet==0.48.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

# Tests: docs/standards/testing.md. La red queda bloqueada salvo en los tests `live`.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "."]
addopts = "--disable-socket --allow-unix-socket -m 'not live'"
markers = [
    "integration: escenario de aceptación principal de una historia, con adaptadores locales reales",
    "live(max_usd): usa servicios reales; queda fuera de la suite por defecto y declara su tope de coste",
]

[tool.coverage.run]
# Solo delega en la CLI; lo ejecuta en subproceso tests/integration/test_clean_start.py.
omit = ["*/jevlab/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "."]
# Código generado por Spec Kit: no lo edita el proyecto (docs/governance.md §5).
extend-exclude = [".specify"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true

# Tareas del proyecto: el mismo comando en Linux y Windows (uv run poe <tarea>).
[tool.poe.env]
PYTHONPATH = "scripts"

[tool.poe.tasks]
lint = [
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
]
typecheck = "mypy"
lint-imports = "lint-imports"
test = "pytest"
cov = [
    { cmd = "pytest -m 'not integration and not live' --cov=jevlab --cov=checks --cov-report=term-missing:skip-covered --cov-fail-under=80" },
    { cmd = "coverage report --include='src/jevlab/domain/*' --fail-under=95" },
]
test-integration = "pytest -m integration"
live = "pytest -m live --force-enable-socket"
check-writing = "python -m checks.writing"
check-commit-msg = "python -m checks.commit_msg"
check-presets = "python -m checks.presets"
check-paths = "python -m checks.paths"
check-agents = "python -m checks.agents"
check = [
    "lint",
    "typecheck",
    "lint-imports",
    "cov",
    "test-integration",
    "check-writing",
    "check-presets",
    "check-paths",
    "check-agents",
]
